# CI: install dependencies, run pytest, execute one live HTTP smoke test (httpbin).
# If your environment blocks outbound HTTPS, replace the smoke step with a mocked test only.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests -q --tb=short

      - name: Smoke — in-process test runner (httpbin.org)
        run: python scripts/ci_smoke_test.py
